<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <title>JazzWhatsApp</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
      <symbol id="chat" viewBox="0 0 24 24">
        <path
          d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9H13a8.5 8.5 0 0 1 8 8v.5z"
        />
      </symbol>
      <symbol id="call" viewBox="0 0 24 24">
        <path
          d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2.2z"
        />
      </symbol>
      <symbol id="bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
      </symbol>
      <symbol id="home" viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v11H3zM9 21v-8h6v8" />
      </symbol>
      <symbol id="settings" viewBox="0 0 24 24">
        <path
          d="m9 3-.6 3-2 1-3-.6L2 10l2.4 2L4 15l2 3 3-.4L11 21h3l1-3 3-1 2-3-1.5-2 .5-3-3-2-3 .5L12 3z"
        />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="back" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6M9 12h12" />
      </symbol>
      <symbol id="plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="mic" viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="12" rx="3" />
        <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8" />
      </symbol>
      <symbol id="send" viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4zM22 2 11 13" />
      </symbol>
      <symbol id="clip" viewBox="0 0 24 24">
        <path
          d="m21 11-9 9a6 6 0 0 1-8-8l10-10a4 4 0 0 1 6 6L9 19a2 2 0 0 1-3-3L16 6"
        />
      </symbol>
      <symbol id="camera" viewBox="0 0 24 24">
        <path d="M3 6h5l2-3h4l2 3h5v15H3z" />
        <circle cx="12" cy="13" r="4" />
      </symbol>
      <symbol id="more" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="12" cy="19" r="1" />
      </symbol>
      <symbol id="speaker" viewBox="0 0 24 24">
        <path d="m11 5-6 4H2v6h3l6 4zM15 8a5 5 0 0 1 0 8M18 5a9 9 0 0 1 0 14" />
      </symbol>
      <symbol id="shield" viewBox="0 0 24 24">
        <path d="m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6zM8 12l3 3 5-6" />
      </symbol>
      <symbol id="check" viewBox="0 0 24 24">
        <path d="m4 12 5 5L20 6" />
      </symbol>
    </svg>
    <div id="app"></div>
    <div id="toast" role="status"></div>
    <div id="modal" class="hidden"></div>
    <script src="app.js"></script>
  </body>
</html>
